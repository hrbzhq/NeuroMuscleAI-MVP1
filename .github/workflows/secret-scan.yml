name: secret-scan

on:
  pull_request:
  push:
    branches: [ main, master, open-source/prep ]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run repo secret scanner
        run: |
          python tools/secret_scan.py | tee tools/secret_scan_output.txt

      - name: Run gitleaks
        uses: zricethezav/gitleaks-action@v2
        with:
          args: --path=. --redact

      - name: Install detect-secrets
        run: |
          python -m pip install --upgrade pip
          pip install detect-secrets

      - name: Run detect-secrets helper
        run: |
          python tools/ci/detect_secrets_check.py

      - name: Upload artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-logs
          path: |
            tools/secret_scan_output.txt
            tools/detect_secrets_findings.json
